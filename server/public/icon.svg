<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Shield -->
  <g filter="url(#glow)">
    <path d="M256 90 L390 148 C390 270 332 376 256 422 C180 376 122 270 122 148 Z" fill="rgba(15, 23, 42, 0.4)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="8"/>
    <!-- Inner Shield -->
    <path d="M256 120 L360 166 C360 262 314 346 256 384 C198 346 152 262 152 166 Z" fill="url(#shieldGrad)"/>
    <!-- Shield Symbol (Eye & Check) -->
    <path d="M256 200 C210 200 174 235 174 260 C174 285 210 320 256 320 C302 320 338 285 338 260 C338 235 302 200 256 200 Z" fill="none" stroke="#4F46E5" stroke-width="18" stroke-linecap="round"/>
    <circle cx="256" cy="260" r="32" fill="#4F46E5"/>
    <circle cx="266" cy="250" r="10" fill="#ffffff"/>
  </g>
</svg>
